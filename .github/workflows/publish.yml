name: Multi Platform Publisher

on:
  push:
    branches: [ main ]
    paths:
      - 'articles/**'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: |
        npm install
        npm install -g zenn-cli
        npm install axios gray-matter js-yaml

    - name: Convert articles
      run: |
        echo "Converting articles..."
        node scripts/convert-articles.js

    - name: Publish to Platforms
      env:
        QIITA_API_TOKEN: ${{ secrets.QIITA_API_TOKEN }}
        DEV_TO_API_KEY: ${{ secrets.DEV_TO_API_KEY }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "Publishing articles..."
        node scripts/publish-articles.js

    - name: Done (no git commit)
      run: |
        echo "Workflow finished. No repository changes will be committed."
