name: Multi Platform Publisher

on:
  push:
    branches: [ main ]
    paths:
      - 'articles/**'
  workflow_dispatch: # 手動実行も可能

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: |
        npm install
        npm install -g zenn-cli
        npm install axios gray-matter js-yaml
    
    - name: Restore published-articles.json from cache
      id: cache-published-articles
      uses: actions/cache@v3
      with:
        path: config/published-articles.json
        key: published-articles-${{ github.repository }}-main
        restore-keys: |
          published-articles-${{ github.repository }}-
    
    - name: Initialize published-articles.json if not exists
      run: |
        mkdir -p config
        if [ ! -f config/published-articles.json ]; then
          echo "⚠️  published-articles.json がキャッシュに見つかりません"
          # Git履歴から復元を試行（移行期間中）
          if git show HEAD:config/published-articles.json > /dev/null 2>&1; then
            echo "📥 Git履歴から復元中..."
            git show HEAD:config/published-articles.json > config/published-articles.json
            echo "✅ Git履歴から復元完了"
          else
            echo "📝 空ファイルを作成（初回実行）"
            echo "{}" > config/published-articles.json
          fi
        else
          echo "✅ published-articles.json をキャッシュから復元しました"
          echo "📋 キャッシュヒット: ${{ steps.cache-published-articles.outputs.cache-hit }}"
        fi
        
    - name: Convert articles
      run: |
        echo "Converting articles..."
        node scripts/convert-articles.js
        
    - name: Publish to APIs
      env:
        QIITA_API_TOKEN: ${{ secrets.QIITA_API_TOKEN }}
        DEV_TO_API_KEY: ${{ secrets.DEV_TO_API_KEY }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "Publishing articles..."
        node scripts/publish-articles.js
        
    - name: Save published-articles.json to cache
      if: always()
      run: |
        # Cache action は自動的に保存しますが、新しい key を使用して強制的に更新する必要があります
        # run_number を使用して、毎回実行時に新しいキャッシュを作成します
        echo "💾 published-articles.json をキャッシュに保存中..."
        if [ -f config/published-articles.json ]; then
          echo "✅ ファイルが存在し、自動的にキャッシュされます"
        else
          echo "⚠️  ファイルが見つかりません。キャッシュに保存できません"
        fi
    
    - name: Update cache with published-articles.json
      if: always()
      uses: actions/cache@v3
      with:
        path: config/published-articles.json
        key: published-articles-${{ github.repository }}-main-${{ github.sha }}
        restore-keys: |
          published-articles-${{ github.repository }}-main-